openapi: 3.0.3
info:
  title: Multi-Tenant SaaS API
  version: 1.0.0
  description: API for organization and business onboarding with multi-tenant support.
    Includes JWT authentication, organization management, business management, and
    integration support for Facebook, WhatsApp, and Slack.
paths:
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: User registration endpoint
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              RegisterRequest:
                value:
                  email: user@example.com
                  password: SecurePass123!
                  password2: SecurePass123!
                  first_name: John
                  last_name: Doe
                summary: Register Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                RegisterResponse:
                  value:
                    message: Registration successful. You are now logged in.
                    access: eyJ0eXAiOiJKV1QiLCJhbGc...
                    refresh: eyJ0eXAiOiJKV1QiLCJhbGc...
                    user:
                      id: 1
                      email: user@example.com
                      first_name: John
                      last_name: Doe
                      is_verified: true
                  summary: Register Response
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Login endpoint
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              LoginRequest:
                value:
                  email: user@example.com
                  password: SecurePass123!
                summary: Login Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                LoginResponse:
                  value:
                    access: eyJ0eXAiOiJKV1QiLCJhbGc...
                    refresh: eyJ0eXAiOiJKV1QiLCJhbGc...
                    user:
                      id: 1
                      email: user@example.com
                      first_name: John
                      last_name: Doe
                      is_verified: true
                  summary: Login Response
          description: ''
  /api/auth/login/google/:
    post:
      operationId: auth_login_google_create
      description: |-
        Endpoint for Google Sign-in callback.
        Expects 'code' in the request body.
      tags:
      - auth
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Logout endpoint - blacklist refresh token
      tags:
      - Authentication
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              examples:
                LogoutResponse:
                  value:
                    message: Logged out successfully
                  summary: Logout Response
          description: ''
  /api/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Email verification endpoint
      tags:
      - Authentication
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
              examples:
                VerifyEmailResponse:
                  value:
                    message: Email verified successfully
                  summary: Verify Email Response
          description: ''
  /api/auth/resend-verification/:
    post:
      operationId: auth_resend_verification_create
      description: Resend verification email
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
            examples:
              ResendVerificationRequest:
                value:
                  email: user@example.com
                summary: Resend Verification Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponse'
              examples:
                ResendVerificationResponse:
                  value:
                    message: Verification email sent
                  summary: Resend Verification Response
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Get and update user profile
      tags:
      - Authentication
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      description: Get and update user profile
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Get and update user profile
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Change password endpoint
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              ChangePasswordRequest:
                value:
                  old_password: OldPass123!
                  new_password: NewPass123!
                  new_password2: NewPass123!
                summary: Change Password Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
              examples:
                ChangePasswordResponse:
                  value:
                    message: Password updated successfully
                  summary: Change Password Response
          description: ''
  /api/auth/forgot-password/:
    post:
      operationId: auth_forgot_password_create
      tags:
      - auth
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/reset-password-confirm/:
    post:
      operationId: auth_reset_password_confirm_create
      tags:
      - auth
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/business/:
    get:
      operationId: auth_business_list
      description: Returns all active businesses the authenticated user has access
        to across all their organizations.
      summary: List user's businesses
      tags:
      - Businesses
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Business'
          description: ''
    post:
      operationId: auth_business_create
      description: Create a new business under the user's active organization. After
        creation the new business becomes the user's active business.
      summary: Create a new business
      tags:
      - Businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBusinessCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserBusinessCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserBusinessCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
          description: ''
  /api/auth/business/switch/:
    post:
      operationId: auth_business_switch_create
      description: Update the authenticated user's active business context. Validates
        that the user has access to the requested business.
      summary: Switch active business
      tags:
      - Businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessSwitchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BusinessSwitchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusinessSwitchRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
          description: ''
  /api/auth/business/generate-persona/:
    post:
      operationId: auth_business_generate_persona_create
      description: Generates a ready-to-use system prompt for the AI agent, grounded
        on the business's stored knowledge base, products and KYC questions. Takes
        no request body. Deducts actual AI token cost (not per-message rate) from
        the business credit balance.
      summary: Generate AI persona / system prompt
      tags:
      - Businesses
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateAiPersonaResponse'
          description: ''
        '400':
          description: Validation error or no active business
  /api/auth/business/team/:
    get:
      operationId: auth_business_team_list
      description: |-
        Manage staff (moderator) accounts for the active business's organization.

        Tenant is resolved server-side from the auth cookie (AI_RULES #5) — the
        frontend never sends an organization id. Only an OWNER/ADMIN of the active
        business's organization may list, add, or remove members.

        - GET    → list the organization's members.
        - POST   → create a moderator (owner sets email + password + sections).
        - PATCH  → change a moderator's granted sections.
        - DELETE → remove a member by `user_id` (query param); never the owner.
      summary: List team members
      tags:
      - Team
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationMembership'
          description: ''
    post:
      operationId: auth_business_team_create
      description: |-
        Manage staff (moderator) accounts for the active business's organization.

        Tenant is resolved server-side from the auth cookie (AI_RULES #5) — the
        frontend never sends an organization id. Only an OWNER/ADMIN of the active
        business's organization may list, add, or remove members.

        - GET    → list the organization's members.
        - POST   → create a moderator (owner sets email + password + sections).
        - PATCH  → change a moderator's granted sections.
        - DELETE → remove a member by `user_id` (query param); never the owner.
      summary: Add a moderator
      tags:
      - Team
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddModeratorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddModeratorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddModeratorRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
          description: ''
    patch:
      operationId: auth_business_team_partial_update
      description: |-
        Manage staff (moderator) accounts for the active business's organization.

        Tenant is resolved server-side from the auth cookie (AI_RULES #5) — the
        frontend never sends an organization id. Only an OWNER/ADMIN of the active
        business's organization may list, add, or remove members.

        - GET    → list the organization's members.
        - POST   → create a moderator (owner sets email + password + sections).
        - PATCH  → change a moderator's granted sections.
        - DELETE → remove a member by `user_id` (query param); never the owner.
      summary: Update a moderator's section access
      tags:
      - Team
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateMemberSectionsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateMemberSectionsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateMemberSectionsRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
          description: ''
    delete:
      operationId: auth_business_team_destroy
      description: |-
        Manage staff (moderator) accounts for the active business's organization.

        Tenant is resolved server-side from the auth cookie (AI_RULES #5) — the
        frontend never sends an organization id. Only an OWNER/ADMIN of the active
        business's organization may list, add, or remove members.

        - GET    → list the organization's members.
        - POST   → create a moderator (owner sets email + password + sections).
        - PATCH  → change a moderator's granted sections.
        - DELETE → remove a member by `user_id` (query param); never the owner.
      summary: Remove a team member
      parameters:
      - in: query
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Team
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/business/settings/:
    get:
      operationId: auth_business_settings_retrieve
      description: Get settings (name, slug, description, default_reply_method, system_prompt,
        currency) for the current user's active business.
      summary: Get active business settings
      tags:
      - Businesses
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSettings'
          description: ''
    patch:
      operationId: auth_business_settings_partial_update
      description: Partially update settings for the current user's active business.
        All fields are optional.
      summary: Update active business settings
      tags:
      - Businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBusinessSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBusinessSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBusinessSettingsRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSettings'
          description: ''
    delete:
      operationId: auth_business_settings_destroy
      description: Soft-delete the current user's active business. Child data is preserved
        and the active context moves to another business. Requires the caller to be
        an org owner/admin (403 otherwise) and refuses to delete the user's last business
        (400).
      summary: Delete active business
      tags:
      - Businesses
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/business/branding/:
    get:
      operationId: auth_business_branding_retrieve
      description: |-
        Get and update the active business's brand identity (logo, contact,
        invoice presentation). Reused by the order-invoice renderer and the
        dashboard's Invoice Settings form.
      summary: Get active business branding
      tags:
      - Businesses
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessBranding'
          description: ''
    patch:
      operationId: auth_business_branding_partial_update
      description: |-
        Get and update the active business's brand identity (logo, contact,
        invoice presentation). Reused by the order-invoice renderer and the
        dashboard's Invoice Settings form.
      summary: Update active business branding
      tags:
      - Businesses
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBusinessBrandingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBusinessBrandingRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBusinessBrandingRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessBranding'
          description: ''
  /api/auth/credit/balance/:
    get:
      operationId: auth_credit_balance_retrieve
      description: Return the active business's credit balance.
      tags:
      - Billing
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalanceResponse'
          description: ''
  /api/auth/pricing-plans/:
    get:
      operationId: auth_pricing_plans_list
      description: |-
        The plans the active business may buy.

        Reads the unified catalog (`ResellerPricingPlan`), scoped per tenant: a
        reseller's client sees that reseller's retail plans, everyone else sees
        AlápAI's. Previously this read the legacy `PricingPlan` table, which is
        empty in production — the pricing page rendered nothing.
      tags:
      - Billing
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResellerPricingPlan'
          description: ''
  /api/auth/subscription/:
    get:
      operationId: auth_subscription_retrieve
      description: 'The active business''s subscription: plan, status, billing period.'
      tags:
      - Billing
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/auth/subscription/change-plan/:
    post:
      operationId: auth_subscription_change_plan_create
      description: |-
        Switch the active business onto another plan.

        Free plans apply immediately. Paid plans return a PENDING invoice (and a
        checkout URL if the configured provider has one) — the allowance is granted
        when that invoice is settled, never before.
      tags:
      - Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePlanRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePlanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePlanRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/subscription/cancel/:
    post:
      operationId: auth_subscription_cancel_create
      description: Cancel at the end of the paid period (default) or immediately.
      tags:
      - Billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/auth/invoices/:
    get:
      operationId: auth_invoices_list
      description: Billing history for the active business (newest first).
      tags:
      - Billing
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/organizations/{organization_id}/businesses/:
    get:
      operationId: auth_organizations_businesses_list
      description: Get all active businesses in the specified organization.
      summary: List businesses in organization
      parameters:
      - in: path
        name: organization_id
        schema:
          type: integer
        required: true
      tags:
      - Businesses
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Business'
              examples:
                ListBusinessesResponse:
                  value:
                  - - id: 1
                      organization: 1
                      organization_name: My Company
                      name: E-commerce Store
                      slug: ecommerce-store
                      description: Our main online store
                      is_active: true
                      created_at: '2026-02-05T12:00:00Z'
                      updated_at: '2026-02-05T12:00:00Z'
                      integration_count: 2
                  summary: List Businesses Response
          description: ''
    post:
      operationId: auth_organizations_businesses_create
      description: Create a new business within an organization. User must be a member
        of the organization.
      summary: Create business
      parameters:
      - in: path
        name: organization_id
        schema:
          type: integer
        required: true
      tags:
      - Businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
            examples:
              CreateBusinessRequest:
                value:
                  name: E-commerce Store
                  slug: ecommerce-store
                  description: Our main online store
                summary: Create Business Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
              examples:
                CreateBusinessResponse:
                  value:
                    id: 1
                    organization: 1
                    organization_name: My Company
                    name: E-commerce Store
                    slug: ecommerce-store
                    description: Our main online store
                    is_active: true
                    created_at: '2026-02-05T12:00:00Z'
                    updated_at: '2026-02-05T12:00:00Z'
                    integration_count: 0
                  summary: Create Business Response
          description: ''
        '404':
          description: Organization not found or access denied
  /api/auth/organizations/{organization_id}/businesses/{id}/:
    delete:
