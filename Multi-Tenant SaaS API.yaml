          type: string
          format: uri
          maxLength: 200
        logo:
          type: string
          format: binary
          title: Logo (with title)
          description: Full logo including the brand name/wordmark. SVG or PNG.
          pattern: (?:svg|png|jpg|jpeg|webp|gif)$
        logo_icon:
          type: string
          format: binary
          description: Icon-only mark used in collapsed/compact placements. SVG or
            PNG.
          pattern: (?:svg|png|jpg|jpeg|webp|gif)$
        favicon:
          type: string
          format: binary
          pattern: (?:svg|png|jpg|jpeg|webp|gif|ico)$
        apple_icon:
          type: string
          format: binary
          title: Apple touch icon
        og_image:
          type: string
          format: binary
          title: Open Graph image
