        description:
          type: string
        business_type:
          allOf:
          - $ref: '#/components/schemas/BusinessTypeEnum'
          description: |-
            Drives which AI agent vertical (toolset + prompts) handles this business. Set during onboarding; changeable in business settings.

            * `ecommerce` - E-commerce (sells products)
            * `services` - Services (appointments / bookings)
        industry:
          type: string
          title: Industry / niche
          description: Free-form niche within the business type (e.g. "fashion/apparel",
            "spice/food", "salon/beauty"). Detected during AI onboarding and used
            to tailor the generated persona, knowledge, and KYC questions.
          maxLength: 120
        onboarding_completed:
          type: boolean
          description: True once the owner has finished (or skipped through) the setup
            wizard.
        onboarding_step:
          type: integer
          maximum: 32767
          minimum: 0
          description: Furthest wizard step reached, so "Resume setup" returns to
            the right place.
        default_reply_method:
          allOf:
          - $ref: '#/components/schemas/DefaultReplyMethodEnum'
          description: |-
            Default reply format for AI agent responses. Customers can override per-conversation.

            * `text` - Text
            * `voice` - Voice
        comment_dm_enabled:
          type: boolean
          title: Send private inbox reply on comments
          description: When off, the AI replies publicly to comments but never sends
            the private Messenger message. The public reply then answers the question
            directly, following this business's system prompt for what may be stated
            publicly (including price).
        system_prompt:
          type: string
          title: AI system prompt
          description: 'Per-business style and tone overrides for the AI agent. The
            base prompt covers universal behavior (be terse, use tools, no markdown,
            no upsell). Use this field to add language-specific phrasings, preferred
            vocabulary, or your brand voice. Example: "Use Bangla loanwords like নাম্বার,
            এড্রেস, কনফার্ম. Pattern asks like ''অর্ডার সম্পন্ন করতে নাম, ফোন, এড্রেস
            দিন''. Never say আমি সাহায্য করব — just answer or ask."'
        comment_prompt:
          type: string
          title: Comment reply persona
          description: Short persona used ONLY for public comment replies (identity,
            tone, what may be said publicly). Auto-generated from the AI system prompt
            whenever it changes; edit to override. Leave empty to use the full system
            prompt.
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        holding_message_enabled:
          type: boolean
          title: Send holding message on handoff
          description: Send a short message to the customer when the AI hands off
            to a human agent, so the customer knows their question was received.
        holding_message_text:
          type: string
          description: Custom message sent at handoff. Leave blank to use a localized
            default based on the customer's language.
        order_status_notifications_enabled:
          type: boolean
          title: Send order status notifications to customer
          description: When on, the customer receives a message on Messenger/WhatsApp
            each time an order status is changed. Turn off to stop these updates.
            Does not affect Meta Conversions API event reporting.
        clip_match_threshold:
          type: integer
          maximum: 32767
          minimum: 0
          description: 'Minimum CLIP visual similarity (0–100) required to trust an
            image match. Higher = stricter. Suggested: perfume/cosmetics 85–90, apparel
            70–80, electronics 80–85.'
        message_debounce_seconds:
          type: number
          format: double
          nullable: true
          title: Message merge window (seconds)
          description: How long to wait and merge a customer's rapid-fire messages
            into one AI reply. Leave empty for automatic (1.5s for text-only service
            chats, 4s otherwise). Raise it (e.g. 6–10s) for customers who type one
            thought across many short messages. Range 0–15 seconds.
        default_image_model:
          type: string
          maxLength: 128
        followup_enabled:
          type: boolean
          title: Follow-up agent enabled
          description: Proactively re-engage stalled leads inside the 24-hour messaging
            window. Follow-ups are AI messages and consume message credits.
        followup_max_attempts:
          type: integer
          maximum: 32767
          minimum: 0
          title: Max follow-up attempts
          description: Maximum follow-up attempts per stalled conversation. Hard-capped
            at 3 in code — you may lower this but never raise it.
        followup_delay_minutes:
          type: integer
          maximum: 32767
          minimum: 0
          title: Follow-up wait (minutes)
          description: How long to wait after the customer goes quiet before following
            up — and the wait between two follow-ups. Clamped to 5-1440 minutes in
            code (beyond 24h the messaging window has closed).
        followup_tone:
          allOf:
          - $ref: '#/components/schemas/FollowupToneEnum'
          title: Follow-up tone
        followup_quiet_start:
          type: string
          format: time
          title: Quiet hours start
          description: No follow-ups sent at/after this business-local time.
        followup_quiet_end:
          type: string
          format: time
          title: Quiet hours end
          description: No follow-ups sent before this business-local time.
        timezone:
          type: string
          description: IANA timezone used for follow-up quiet-hours (e.g. Asia/Dhaka).
            The rest of the system runs in UTC.
          maxLength: 64
        followup_proof_snippets:
          title: Proof snippets
          description: Owner-supplied testimonials/proof the follow-up agent may cite.
            Never AI-invented.
        followup_allowed_offers:
          title: Allowed offers
          description: Owner-supplied discount/offer language the agent may use. Never
            AI-invented.
        followup_excluded_customer_ids:
          title: Follow-up exclusion list
          description: messenger_user_ids to never follow up with.
        followup_instructions:
          type: string
          title: Follow-up instructions
          description: Per-business guidance for how follow-up messages are written
            (tone, what to mention, what to ask). Layered onto the built-in follow-up
            behavior; never overrides the anti-fabrication rules. Leave blank for
            default behavior.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
      - updated_at
