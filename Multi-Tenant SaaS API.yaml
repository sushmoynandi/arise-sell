                                                        — only media made with that template
        POST /api/v1/media-assets/                     — direct upload (e.g. template
                                                         preview picker "Upload new" tab)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: source_template
        schema:
          type: integer
        description: Restrict to media created from the given template id. Powers
          the 'Made with this template' tab in the preview picker.
      tags:
      - Media Assets
