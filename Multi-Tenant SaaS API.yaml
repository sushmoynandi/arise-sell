components:
  schemas:
    ActiveBusiness:
      type: object
      description: |-
        Minimal active-business shape embedded in the profile payload so the
        app shell can render the credit badge in one round-trip.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        credit_balance:
          type: integer
          readOnly: true
        ai_credit_balance:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
      required:
      - ai_credit_balance
      - credit_balance
      - currency
      - id
      - name
    AddModeratorRequest:
      type: object
      description: |-
