      type: object
      description: |-
        Public, read-only shape for a reseller's retail plan.

        Returns `billing_model` plus both field groups; the value is null for the
        group that doesn't apply, so the landing page renders the right card layout
        (per-message rate for 'credit', included messages for 'quota').
      properties:
        id:
          type: integer
          readOnly: true
        billing_model:
          allOf:
          - $ref: '#/components/schemas/BillingModel2e4Enum'
          description: |-
            Determines which fields below apply and how messages are charged.

            * `quota` - Prepaid quota (fixed messages per package)
            * `conversation_quota` - Prepaid conversations (1 per customer per rolling 24h window)
        name:
          type: string
          title: Plan name
          maxLength: 100
        description:
          type: string
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        validity_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Validity in days
        is_popular:
          type: boolean
          title: Most popular
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        interval:
          allOf:
          - $ref: '#/components/schemas/IntervalEnum'
          title: Billing interval
          description: |-
            One-time = prepaid pack (grant adds to the wallet). Monthly/Yearly = subscription (quota resets each period).

            * `one_time` - One-time (prepaid pack, never renews)
            * `month` - Monthly
            * `year` - Yearly
        interval_count:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Number of intervals per period, e.g. 3 with "Monthly" bills
            quarterly. Ignored for one-time plans.
        trial_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Free trial length before the first invoice. 0 = no trial.
        is_recurring:
          type: boolean
          readOnly: true
        recharge_amount:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Recharge amount (smallest unit)
          description: 'Credit model: amount the customer pays, e.g. 25000 for ৳250.'
        recharge_amount_display:
          type: string
          readOnly: true
        rate_per_message:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Rate per message (smallest unit)
          description: 'Credit model: cost per message, e.g. 45 for ৳0.45.'
        rate_per_message_display:
          type: string
          readOnly: true
        bonus_amount:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Bonus amount (smallest unit)
          description: 'Credit model: extra credit granted on purchase.'
        bonus_amount_display:
          type: string
          readOnly: true
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Package price (smallest unit)
          description: 'Quota model: package price, e.g. 459900 for ৳4599.'
        price_display:
          type: string
          readOnly: true
        message_quota:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Included messages
          description: 'Quota model: number of messages granted, e.g. 10000.'
        conversation_quota:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Included conversations
          description: 'Conversation model: conversations granted, e.g. 350. Uses
            `price` as the package price.'
      required:
      - bonus_amount_display
      - id
      - is_recurring
      - name
      - price_display
      - rate_per_message_display
      - recharge_amount_display
