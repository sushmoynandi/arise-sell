      description: |-
        POST /api/v1/campaigns/templates/drafts/  {..., id?}

        Save without sending. Pass `id` to update an existing draft — omitting it
        creates a second row that then collides with the first on the name.

        Drafts exist because submission is one-way: Meta will not re-issue a name it
        has seen, so an owner halfway through writing needs somewhere to leave the
        work that is not "spend the name and hope". A draft has no Meta presence and
        `sendable_for_business` filters on APPROVED, so it can never reach a
        campaign.
