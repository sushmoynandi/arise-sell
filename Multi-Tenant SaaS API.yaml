    get:
      operationId: v1_dashboard_conversations_retrieve
      description: |-
        Unified inbox list (WhatsApp-Web-style single list), newest first.

        Query params:
          ?status=   narrow to one status; `resolved` switches to the closed list
          ?search=   match customer name, or phone/thread id by digits
          ?limit=    page size (opts into the paginated envelope)
          ?cursor=   opaque keyset cursor from a previous page's `next`

        Pagination is opt-in: without `limit`/`cursor` this still answers with the
        bare unbounded array. That is only for the transition — a browser holding
        the pre-pagination bundle keeps working across the deploy. Drop the legacy
        branch once that build is gone; it is the reason one business was shipping
        12,744 rows / 8.3 MB on every inbox load and on every socket burst.
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          description: No response body
