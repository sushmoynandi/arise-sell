      description: |-
        The image models a tenant may pick from — the picker's whole data source.

        `?template=<id>` adds compatibility: a template that draws Bangla text, or
        composites a supplied product photo, cannot run on every model, so each
        row comes back with `is_available` and a machine-readable
        `unavailable_reason` the frontend localises. Incompatible models are
        returned (disabled), not hidden — a card that explains itself teaches the
        catalogue, a missing one just looks arbitrary.
      tags:
      - Prompt Generations
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageModel'
          description: ''
