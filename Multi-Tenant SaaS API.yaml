      type: object
      description: |-
        Writable branding shape for the reseller dashboard (PATCH, multipart).

        All fields optional so the dashboard can PATCH partially. Image fields map
        to the model's FileField/ImageField, so logo/logo_icon/favicon accept SVG
        while apple_icon/og_image require a raster image (Pillow-validated).
      properties:
        brand_name:
          type: string
