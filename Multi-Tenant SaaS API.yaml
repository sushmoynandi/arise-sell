  /api/v1/tools/prompt-gallery/templates/:
    post:
      operationId: v1_tools_prompt_gallery_templates_create
      description: |-
        Marketplace template CRUD.

        - `GET /templates/` — marketplace feed (LIVE + PUBLIC + admin-enabled).
          Query params: `modality`, `category`, `tag`, `search`, `sort=popular|new|trending`.
        - `GET /templates/{id}/` — retrieve. Authors can also retrieve their own
          drafts / unlisted templates.
        - `POST /templates/` — publish a new template. `request.user` becomes
          the author; status is set to LIVE (instant publish).
        - `PATCH/PUT /templates/{id}/` — author or staff only.
        - `DELETE /templates/{id}/` — soft delete (status=REMOVED). Author or staff.
        - `GET /templates/mine/` — list everything the caller has authored,
          regardless of status / visibility.
      tags:
      - Prompt Templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptTemplateWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PromptTemplateWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PromptTemplateWriteRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptTemplateWrite'
          description: ''
    get:
      operationId: v1_tools_prompt_gallery_templates_list
      description: |-
        Marketplace template CRUD.

        - `GET /templates/` — marketplace feed (LIVE + PUBLIC + admin-enabled).
          Query params: `modality`, `category`, `tag`, `search`, `sort=popular|new|trending`.
        - `GET /templates/{id}/` — retrieve. Authors can also retrieve their own
          drafts / unlisted templates.
        - `POST /templates/` — publish a new template. `request.user` becomes
          the author; status is set to LIVE (instant publish).
        - `PATCH/PUT /templates/{id}/` — author or staff only.
        - `DELETE /templates/{id}/` — soft delete (status=REMOVED). Author or staff.
        - `GET /templates/mine/` — list everything the caller has authored,
          regardless of status / visibility.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Prompt Templates
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPromptTemplateListList'
          description: ''
  /api/v1/tools/prompt-gallery/templates/draft/:
    post:
      operationId: v1_tools_prompt_gallery_templates_draft_create
      description: |-
        AI-assisted authoring. Caller pastes a raw prompt; we return a
        structured draft (title, raw_prompt with `{{markers}}`, placeholder
        schema, etc.) the publish form pre-fills.

        Doesn't persist anything — the user reviews + edits + submits a
        normal `POST /templates/` to publish.
      tags:
      - Prompt Templates
      requestBody:
        content:
          application/json:
